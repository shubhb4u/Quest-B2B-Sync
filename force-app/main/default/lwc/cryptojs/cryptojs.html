<template>
  <lightning-card title="Encrypt and Decrypt String with Secret Key">
      <div class="slds-p-around_medium">
          <lightning-input
              label="Input String"
              value={inputString}
              onchange={handleInputChange}
          ></lightning-input>

          <lightning-button
              label="Encrypt"
              onclick={handleEncrypt}
              class="slds-m-top_small"
          ></lightning-button>

          <lightning-button
              label="Decrypt"
              onclick={handleDecrypt}
              class="slds-m-top_small"
          ></lightning-button>

          <p class="slds-m-top_medium"><strong>Encrypted String:</strong></p>
          <p>{encryptedString}</p>

          <p class="slds-m-top_medium"><strong>Decrypted String:</strong></p>
          <p>{decryptedString}</p>
      </div>
  </lightning-card>
</template>
